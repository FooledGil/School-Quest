<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Silhouette Gradient -->
    <linearGradient id="silGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glow / Neon Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.3" />
    </pattern>

    <!-- Shadow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgGrad)" rx="32" />
  <rect width="256" height="256" fill="url(#pixelGrid)" rx="32" />

  <!-- Inner Tech Border -->
  <rect x="8" y="8" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Person Silhouette -->
  <g id="silhouette" opacity="0.85">
    <!-- Torso / Shoulders -->
    <path d="M 40 248 C 40 188, 76 160, 128 160 C 180 160, 216 188, 216 248 Z" fill="url(#silGrad)" />
    <path d="M 40 248 C 40 188, 76 160, 128 160 C 180 160, 216 188, 216 248" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5" />

    <!-- Head -->
    <circle cx="128" cy="98" r="48" fill="url(#silGrad)" />
    <circle cx="128" cy="98" r="48" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Glowing Mystery Badge / Question Mark -->
  <g filter="url(#neonGlow)">
    <!-- Question Mark Text Styled with Game / Tech Aesthetic -->
    <text 
      x="128" 
      y="114" 
      font-family="'Press Start 2P', monospace, sans-serif" 
      font-size="44" 
      font-weight="bold" 
      fill="url(#glowGrad)" 
      text-anchor="middle"
      dominant-baseline="central"
      letter-spacing="-1"
    >?</text>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 240 28 L 240 16 L 228 16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 16 228 L 16 240 L 28 240" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 240 228 L 240 240 L 228 240" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
</svg>
